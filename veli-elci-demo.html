<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Veli Elçi Programı</title>
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#1F6B5C">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Fredoka:wght@500;600&display=swap">
<style>
/* Yerleşim: üstte demo şeridi ve rol seçici. Okul panelinde kayıt hunisi ve aday listesi; veli ekranında tek bir davet kartı; aday ekranında kısa randevu formu. */
:root{
  --bg:#F2F5F0; --surface:#FFFFFF; --sunk:#E6ECE4;
  --ink:#15302B; --ink-2:#34504A; --muted:#5C706A;
  --line:#D6DFD5; --line-2:#B7C6BB;
  --brand:#1F6B5C; --brand-2:#17564A; --on-brand:#FFFFFF; --brand-soft:#DCEDE7;
  --sun:#F4B41A; --sun-soft:#FDF1CF; --sun-ink:#5F4300;
  --yeni:#B4510B; --yeni-soft:#FBE6D3;
  --surec:#27598F; --surec-soft:#DCE8F6;
  --kayit:#1F6B5C; --kayit-soft:#DCEDE7;
  --vaz:#6B7572; --vaz-soft:#E7EAE8;
  --display:"Fredoka","Trebuchet MS","Segoe UI",system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:14px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0F1B19; --surface:#172624; --sunk:#0B1513;
    --ink:#E9F0EC; --ink-2:#C6D3CD; --muted:#93A69F;
    --line:#263A36; --line-2:#3B544D;
    --brand:#52B8A0; --brand-2:#6CCAB3; --on-brand:#0B1513; --brand-soft:#1C3A34;
    --sun:#F4B41A; --sun-soft:#3A2F0E; --sun-ink:#F8D77A;
    --yeni:#F2A76A; --yeni-soft:#3D2716;
    --surec:#8FB8E8; --surec-soft:#1B2C40;
    --kayit:#6CCAB3; --kayit-soft:#1C3A34;
    --vaz:#9AA5A1; --vaz-soft:#222C2A;
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;
  padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
[hidden]{display:none!important}
h1,h2,h3{font-family:var(--display);font-weight:600;margin:0;text-wrap:balance;line-height:1.2}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

/* demo şeridi */
.demo{background:var(--ink);color:var(--bg);position:sticky;top:0;z-index:10}
.demo-ic{max-width:1080px;margin:0 auto;padding:8px 20px;display:flex;align-items:center;gap:10px 16px;flex-wrap:wrap}
.demo-et{font-size:12px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;background:var(--sun);color:#3A2A00;border-radius:6px;padding:2px 8px}
.demo-not{font-size:13px;opacity:.8;flex:1 1 200px;min-width:0}
.roller{display:inline-flex;gap:2px;background:rgba(127,127,127,.25);border-radius:999px;padding:3px;flex-wrap:wrap}
.roller button{border:0;background:transparent;color:inherit;border-radius:999px;padding:5px 13px;font-size:13px;font-weight:600;opacity:.75}
.roller button[aria-pressed="true"]{background:var(--bg);color:var(--ink);opacity:1}
.demo select{background:transparent;border:1px solid rgba(127,127,127,.5);border-radius:8px;padding:4px 8px;font-size:13px;color:inherit;max-width:100%}
.demo select option{color:#15302B;background:#fff}
.demo .yazi-btn{border:0;background:transparent;color:inherit;font-size:13px;text-decoration:underline;opacity:.8;padding:4px}

.wrap{max-width:1080px;margin:0 auto;padding-inline:20px;padding-block:26px 72px;display:flex;flex-direction:column;gap:22px}
.wrap.dar{max-width:560px}
.kart{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.ust{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.ust h1{font-size:28px}
.ust small,.kunye{font-size:13px;color:var(--muted)}
.ek{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}

/* özet + huni */
.ozet{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:22px}
.sayilar{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px 20px}
.sayi b{display:block;font-family:var(--display);font-weight:600;font-size:38px;line-height:1.05;letter-spacing:-.01em}
.sayi span{font-size:13px;color:var(--muted)}
.sayi.one b{color:var(--brand)}
.huni{display:flex;flex-direction:column;gap:9px}
.huni .sat{display:grid;grid-template-columns:104px minmax(0,1fr) 28px;gap:10px;align-items:center;font-size:13px}
.huni .iz{height:18px;border-radius:6px;background:var(--sunk);overflow:hidden}
.huni .iz i{display:block;height:100%;border-radius:6px;background:var(--brand)}
.huni .sat:last-child .iz i{background:var(--sun)}
.huni .sat b{text-align:right}

.uyari{background:var(--yeni-soft);border:1px solid transparent;border-radius:var(--r);padding:14px 18px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.uyari p{color:var(--ink);font-weight:600}
.uyari span{font-weight:400;color:var(--ink-2)}

/* sekmeler */
.sekmeler{display:flex;gap:4px;border-bottom:1px solid var(--line-2);overflow-x:auto}
.sekmeler button{border:0;background:transparent;padding:10px 14px;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-1px;white-space:nowrap}
.sekmeler button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--brand)}
.suz{display:flex;gap:6px;flex-wrap:wrap}
.suz button{border:1px solid var(--line-2);background:transparent;border-radius:999px;padding:4px 12px;font-size:13px;font-weight:500;color:var(--ink-2)}
.suz button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* listeler */
.liste{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.liste li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 16px;align-items:center;padding:14px 4px;border-bottom:1px solid var(--line)}
.liste li:last-child{border-bottom:0}
.kim{min-width:0}
.kim strong{font-size:16px;overflow-wrap:anywhere}
.kim .alt{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.sag{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.rozet{display:inline-block;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:700;white-space:nowrap}
.rozet.yeni{background:var(--yeni-soft);color:var(--yeni)}
.rozet.arandi,.rozet.randevu,.rozet.gezdi{background:var(--surec-soft);color:var(--surec)}
.rozet.kayit{background:var(--kayit-soft);color:var(--kayit)}
.rozet.vazgecti{background:var(--vaz-soft);color:var(--vaz)}
.rozet.kazanc{background:var(--sun-soft);color:var(--sun-ink)}
select.asama{border:1px solid var(--line-2);background:var(--surface);border-radius:8px;padding:6px 8px;font-size:13px;font-weight:600;max-width:100%}
.btn{border:0;border-radius:10px;background:var(--brand);color:var(--on-brand);padding:11px 18px;font-weight:700}
.btn:hover{background:var(--brand-2)}
.btn.blok{width:100%}
.btn.wa{background:#1FA855;color:#fff;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}
.mini{border:1px solid var(--line-2);background:transparent;border-radius:8px;padding:6px 12px;font-size:13px;font-weight:600}
.mini:hover{background:var(--sunk)}
.mini.tamam{border-color:transparent;background:var(--sun-soft);color:var(--sun-ink)}
.bos{color:var(--muted);padding:18px 4px}

/* formlar */
.form{display:flex;flex-direction:column;gap:14px}
.alan{display:flex;flex-direction:column;gap:5px;min-width:0}
.alan > span{font-size:13px;font-weight:600;color:var(--ink-2)}
.alan input,.alan select,.alan textarea{width:100%;min-width:0;background:var(--bg);border:1px solid var(--line-2);border-radius:10px;padding:11px 12px}
.ikili{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.onay{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;font-size:13px;color:var(--ink-2);align-items:start}
.onay input{width:18px;height:18px;margin-top:2px;accent-color:var(--brand)}
.hata{color:var(--yeni);font-size:13px;font-weight:600}
.satir-form{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto;gap:10px;align-items:end}

/* veli ekranı */
.selam h1{font-size:30px}
.selam p{color:var(--ink-2);margin-top:6px;max-width:44ch}
.odul{background:var(--sun-soft);border-radius:var(--r);padding:16px 18px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;align-items:center}
.odul .yildiz{width:44px;height:44px;border-radius:50%;background:var(--sun);display:grid;place-items:center;font-family:var(--display);font-size:22px;color:#3A2A00}
.odul b{display:block;font-family:var(--display);font-weight:600;font-size:17px}
.odul span{font-size:13px;color:var(--ink-2)}
.davet{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:20px;align-items:center}
.link{font-size:13px;background:var(--sunk);border-radius:8px;padding:9px 11px;overflow-wrap:anywhere;user-select:all;font-family:ui-monospace,Menlo,Consolas,monospace}
.dugmeler{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.qr{width:132px;background:#fff;border-radius:10px;padding:8px;line-height:0}
.qr svg{width:100%;height:auto;display:block}
.adimlar{list-style:none;margin:0;padding:0;display:grid;gap:10px;counter-reset:a}
.adimlar li{display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;align-items:start;counter-increment:a}
.adimlar li::before{content:counter(a);width:28px;height:28px;border-radius:50%;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;font-weight:700;font-size:13px}
.tesekkur{text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center;padding-block:34px}
.tesekkur .tik{width:64px;height:64px;border-radius:50%;background:var(--kayit-soft);color:var(--kayit);display:grid;place-items:center;font-size:30px;font-weight:700}

.bildirim{position:fixed;left:50%;transform:translateX(-50%);bottom:0;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 18px);pointer-events:none;z-index:20;max-width:calc(100% - 32px)}
.bildirim div{background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:14px;font-weight:600;box-shadow:0 8px 28px rgba(0,0,0,.22)}

@media (max-width:760px){
  .ozet{grid-template-columns:minmax(0,1fr)}
  .satir-form{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){
  .wrap{padding-inline:16px}
  .demo-ic{padding-inline:16px}
  .ust h1{font-size:24px}
  .sayi b{font-size:32px}
  .liste li{grid-template-columns:minmax(0,1fr)}
  .sag{justify-content:flex-start}
  .davet{grid-template-columns:minmax(0,1fr)}
  .qr{justify-self:start}
  .ikili{grid-template-columns:minmax(0,1fr)}
  .huni .sat{grid-template-columns:88px minmax(0,1fr) 24px}
}
@media (prefers-reduced-motion:no-preference){.huni .iz i{transition:width .3s ease}}
</style>
</head>
<body>

<div class="demo" role="region" aria-label="Demo denetimleri">
  <div class="demo-ic">
    <span class="demo-et">Demo</span>
    <div class="roller" role="group" aria-label="Ekran">
      <button type="button" id="rolOkul" data-rol="okul" aria-pressed="true">Okul paneli</button>
      <button type="button" id="rolElci" data-rol="elci" aria-pressed="false">Elçi veli ekranı</button>
      <button type="button" id="rolDavet" data-rol="davet" aria-pressed="false">Davet edilen veli</button>
    </div>
    <label id="elciSecKutu" hidden><span class="demo-not" style="margin-right:6px">Veli:</span><select id="elciSec" aria-label="Hangi velinin ekranı"></select></label>
    <span class="demo-not">Örnek verilerle çalışır; isimler gerçek kişi değildir.</span>
    <button type="button" class="yazi-btn" id="sifirla">Demoyu sıfırla</button>
  </div>
</div>

<main id="gorunum"></main>
<div class="bildirim" aria-live="polite"><div id="bildirim" hidden></div></div>

function ornek(){

      {kod:'ELIF2',ad:'Elif Demir',sinif:'Kelebekler (4 yaş)'},
      {kod:'CANS9',ad:'Cansu Öztürk',sinif:'2-B'},
      {kod:'BURA5',ad:'Burak Şahin',sinif:'Uğur Böcekleri (3 yaş)'}
    ],

      {id:'a1',ad:'Zeynep Kaya',tel:'0500 000 00 01',kademe:'4 yaş',elci:'AYSE4',tarih:gunOnce(12),tercih:'Hafta içi sabah',asama:'kayit',odulVerildi:false},

      {id:'a3',ad:'Selin Koç',tel:'0500 000 00 03',kademe:'3 yaş',elci:'AYSE4',tarih:gunOnce(1),tercih:'Hafta içi öğleden sonra',asama:'yeni',odulVerildi:false},
      {id:'a4',ad:'Hakan Polat',tel:'0500 000 00 04',kademe:'5 yaş',elci:'MEHM7',tarih:gunOnce(15),tercih:'Hafta içi sabah',asama:'kayit',odulVerildi:true},
      {id:'a5',ad:'Derya Çelik',tel:'0500 000 00 05',kademe:'1. sınıf',elci:'MEHM7',tarih:gunOnce(6),tercih:'Cumartesi',asama:'randevu',odulVerildi:false},
      {id:'a6',ad:'Gökhan Aksoy',tel:'0500 000 00 06',kademe:'2. sınıf',elci:'ELIF2',tarih:gunOnce(8),tercih:'Hafta içi sabah',asama:'vazgecti',odulVerildi:false},

function yukle(){
  try{var h=localStorage.getItem(ANAHTAR);if(h){var v=JSON.parse(h);if(v&&v.okul&&Array.isArray(v.elciler)&&Array.isArray(v.adaylar))return v;}}catch(e){}
  return ornek();
}

function sakla(){try{localStorage.setItem(ANAHTAR,JSON.stringify(V));}catch(e){}}
var U={sekme:'adaylar',suz:'hepsi',gonderildi:false,sifirOnay:false};

/* ---------- yardımcılar ---------- */
function el(tag,attrs){
  var n=document.createElement(tag),k,i;
  if(attrs) for(k in attrs){
    var v=attrs[k];
    if(v==null||v===false) continue;
    if(k==='class') n.className=v;
    else if(k==='text') n.textContent=v;
    else if(k.slice(0,2)==='on') n.addEventListener(k.slice(2),v);
    else n.setAttribute(k,v===true?'':v);
  }
  for(i=2;i<arguments.length;i++) if(arguments[i]!=null) n.append(arguments[i]);
  return n;
}
function tarihKisa(t){var p=String(t).split('-');return (+p[2])+' '+AYK[+p[1]-1];}
function elciBul(kod){for(var i=0;i<V.elciler.length;i++) if(V.elciler[i].kod===kod) return V.elciler[i];return null;}
function kisaAd(ad){var p=String(ad).trim().split(/\s+/);return p.length>1?p[0]+' '+p[p.length-1].charAt(0)+'.':p[0];}
function davetLinki(kod){return location.href.split('#')[0]+'#/davet/'+kod;}
function elciSayilari(kod){
  var s={davet:0,kayit:0,bekleyen:0};
  V.adaylar.forEach(function(a){if(a.elci!==kod)return;s.davet++;if(a.asama==='kayit'){s.kayit++;if(!a.odulVerildi)s.bekleyen++;}});
  return s;
}
var bT=null;
function bildir(m){var b=$('bildirim');b.textContent=m;b.hidden=false;clearTimeout(bT);bT=setTimeout(function(){b.hidden=true;},2600);}
function kopyala(metin,mesaj){
  var tamam=function(){bildir(mesaj||'Kopyalandı');};
  var yedek=function(){
    var t=el('textarea',{style:'position:fixed;opacity:0'});t.value=metin;document.body.append(t);t.select();
    try{document.execCommand('copy');tamam();}catch(e){bildir('Kopyalanamadı; metni elle seçip kopyalayın.');}
    t.remove();
  };
  if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(metin).then(tamam,yedek); else yedek();
}
function kodUret(ad){
  var harf=String(ad).toLocaleUpperCase('tr').replace(/Ç/g,'C').replace(/Ğ/g,'G').replace(/İ/g,'I').replace(/Ö/g,'O').replace(/Ş/g,'S').replace(/Ü/g,'U').replace(/[^A-Z]/g,'').slice(0,4)||'VELI';
  var kod;do{kod=harf+Math.floor(1+Math.random()*9);}while(elciBul(kod)&&V.elciler.length<9);
  while(elciBul(kod)) kod=harf+Math.floor(10+Math.random()*90);
  return kod;
}

function rota(){
  var h=location.hash.replace(/^#\/?/,'').split('/');
  if(h[0]==='elci'||h[0]==='davet') return {rol:h[0],kod:h[1]||(V.elciler[0]&&V.elciler[0].kod)||''};
  return {rol:'okul',kod:''};
}
function git(rol,kod){location.hash=rol==='okul'?'#/okul':'#/'+rol+'/'+(kod||'');}

/* ---------- okul paneli ---------- */
function cizOkul(kok){
  var toplam=V.adaylar.length;
  var say=function(min){return V.adaylar.filter(function(a){return SIRA[a.asama]>=min;}).length;};
  var gezen=say(3), kayit=say(4), yeni=V.adaylar.filter(function(a){return a.asama==='yeni';}).length;
  var bekleyenOdul=V.adaylar.filter(function(a){return a.asama==='kayit'&&!a.odulVerildi;}).length;

  var wrap=el('div',{class:'wrap'});
  wrap.append(el('div',{class:'ust'},
    el('div',null,el('div',{class:'ek',text:'Veli Elçi Programı'}),el('h1',{text:V.okul.ad})),
    el('small',{text:V.okul.donem})));

  var sayilar=el('div',{class:'sayilar'},
    el('div',{class:'sayi'},el('b',{class:'num',text:toplam}),el('span',{text:'tavsiyeyle gelen aile'})),
    el('div',{class:'sayi'},el('b',{class:'num',text:gezen}),el('span',{text:'okulu gezen'})),
    el('div',{class:'sayi one'},el('b',{class:'num',text:kayit}),el('span',{text:'kayıt olan'})),
    el('div',{class:'sayi'},el('b',{class:'num',text:toplam?'%'+Math.round(kayit/toplam*100):'—'}),el('span',{text:'başvurudan kayda dönüşüm'})));
  var huni=el('div',{class:'huni','aria-label':'Kayıt hunisi'});
  [['Başvuru',toplam],['Arandı',say(1)],['Tur randevusu',say(2)],['Okulu gezdi',gezen],['Kayıt oldu',kayit]].forEach(function(h){
    var cub=el('i');cub.style.width=(toplam?h[1]/toplam*100:0)+'%';
    huni.append(el('div',{class:'sat'},el('span',{text:h[0]}),el('div',{class:'iz'},cub),el('b',{class:'num',text:h[1]})));
  });
  wrap.append(el('section',{class:'kart ozet','aria-label':'Özet'},sayilar,huni));

  if(yeni>0){
    wrap.append(el('div',{class:'uyari'},
      el('p',null,yeni+' aile aranmayı bekliyor. ',el('span',{text:'Tavsiyeyle gelen aile sıcak adaydır; ilk gün aramak dönüşümü artırır.'})),
      el('button',{type:'button',class:'mini',text:'Bekleyenleri göster',onclick:function(){U.sekme='adaylar';U.suz='yeni';ciz();}})));
  }

  var sekmeler=el('div',{class:'sekmeler',role:'tablist'});
  [['adaylar','Aday aileler ('+toplam+')'],['elciler','Elçi veliler ('+V.elciler.length+')'],['ayar','Program ayarı']].forEach(function(s){
    sekmeler.append(el('button',{type:'button',role:'tab',id:'sekme-'+s[0],'aria-selected':U.sekme===s[0]?'true':'false',text:s[1],onclick:function(){U.sekme=s[0];ciz();}}));
  });
  var govde=el('section',{class:'kart'});
  wrap.append(el('div',null,sekmeler,govde));
  govde.style.borderTopLeftRadius=govde.style.borderTopRightRadius='0';govde.style.borderTop='0';

  if(U.sekme==='adaylar') adaylarSekmesi(govde,bekleyenOdul);
  else if(U.sekme==='elciler') elcilerSekmesi(govde);
  else ayarSekmesi(govde);
  kok.append(wrap);
}
function adaylarSekmesi(govde,bekleyenOdul){
  var suz=el('div',{class:'suz',role:'group','aria-label':'Aşamaya göre süz'});
  [['hepsi','Hepsi']].concat(ASAMALAR).forEach(function(a){
    suz.append(el('button',{type:'button',id:'suz-'+a[0],'aria-pressed':U.suz===a[0]?'true':'false',text:a[1],onclick:function(){U.suz=a[0];ciz();}}));
  });
  govde.append(suz);
  var liste=V.adaylar.map(function(a,i){return {a:a,i:i};}).filter(function(x){return U.suz==='hepsi'||x.a.asama===U.suz;})
    .sort(function(x,y){return x.a.tarih<y.a.tarih?1:x.a.tarih>y.a.tarih?-1:y.i-x.i;}).map(function(x){return x.a;});
  if(!liste.length){govde.append(el('p',{class:'bos',text:'Bu aşamada aile yok.'}));return;}
  var ul=el('ul',{class:'liste'});
  liste.forEach(function(a){
    var e=elciBul(a.elci);
    var sec=el('select',{class:'asama',id:'asama-'+a.id,'aria-label':a.ad+' için aşama',onchange:function(ev){
      a.asama=ev.target.value; if(a.asama!=='kayit') a.odulVerildi=false; sakla();
      bildir(a.ad+': '+ASAMA_AD[a.asama]+(a.asama==='kayit'&&e?' · '+e.ad+' ödül kazandı':'')); ciz();
    }});
    ASAMALAR.forEach(function(s){var o=el('option',{value:s[0],text:s[1]});if(s[0]===a.asama)o.selected=true;sec.append(o);});
    var sag=el('div',{class:'sag'},el('span',{class:'rozet '+a.asama,text:ASAMA_AD[a.asama]}),sec);
    if(a.asama==='kayit'&&e){
      sag.append(el('button',{type:'button',class:'mini'+(a.odulVerildi?' tamam':''),text:a.odulVerildi?'Ödül verildi ✓':'Ödülü verildi işaretle',
        onclick:function(){a.odulVerildi=!a.odulVerildi;sakla();ciz();}}));
    }
    ul.append(el('li',null,
      el('div',{class:'kim'},
        el('strong',{text:a.ad}),
        el('div',{class:'alt',text:a.kademe+' · '+a.tel+' · '+a.tercih}),
        el('div',{class:'alt',text:(e?'Tavsiye eden: '+e.ad+' ('+e.sinif+')':'Doğrudan başvuru')+' · '+tarihKisa(a.tarih)})),
      sag));
  });
  govde.append(ul);
  if(bekleyenOdul>0&&(U.suz==='hepsi'||U.suz==='kayit')) govde.append(el('p',{class:'kunye',style:'padding:10px 4px 0',text:bekleyenOdul+' elçi veli ödülünü bekliyor.'}));
}
function elcilerSekmesi(govde){
  govde.append(el('p',{class:'kunye',text:'Her velinin kendine özel bir davet linki var. Linkten gelen her başvuru o velinin hanesine yazılır.'}));
  var sirali=V.elciler.map(function(e){return {e:e,s:elciSayilari(e.kod)};}).sort(function(a,b){return b.s.kayit-a.s.kayit||b.s.davet-a.s.davet;});
  var ul=el('ul',{class:'liste'});
  sirali.forEach(function(x){
    var e=x.e,s=x.s;
    var sag=el('div',{class:'sag'});
    if(s.bekleyen>0) sag.append(el('span',{class:'rozet kazanc',text:s.bekleyen+' ödül bekliyor'}));
    sag.append(
      el('button',{type:'button',class:'mini',text:'Linki kopyala',onclick:function(){kopyala(davetLinki(e.kod),e.ad+' için davet linki kopyalandı');}}),
      el('button',{type:'button',class:'mini',text:'Veli ekranını aç',onclick:function(){git('elci',e.kod);}}));
    ul.append(el('li',null,
      el('div',{class:'kim'},el('strong',{text:e.ad}),
        el('div',{class:'alt',text:e.sinif+' · '+s.davet+' aile davet etti · '+s.kayit+' kayıt'})),
      sag));
  });
  govde.append(ul);
  var f=el('form',{class:'satir-form',id:'elciEkle',novalidate:true,style:'margin-top:16px;padding-top:16px;border-top:1px solid var(--line)'},
    el('label',{class:'alan'},el('span',{text:'Yeni elçi veli'}),el('input',{type:'text',id:'yeniElciAd',placeholder:'Ad soyad',maxlength:'60',autocomplete:'off'})),
    el('label',{class:'alan'},el('span',{text:'Çocuğunun sınıfı'}),el('input',{type:'text',id:'yeniElciSinif',placeholder:'Örnek: 1-A',maxlength:'40',autocomplete:'off'})),
    el('button',{type:'submit',class:'btn',text:'Ekle'}));
  f.addEventListener('submit',function(ev){
    ev.preventDefault();
    var ad=$('yeniElciAd').value.trim(), sinif=$('yeniElciSinif').value.trim();
    if(!ad){bildir('Velinin adını yazın.');$('yeniElciAd').focus();return;}
    V.elciler.push({kod:kodUret(ad),ad:ad,sinif:sinif||'Sınıf belirtilmedi'});sakla();
    bildir(ad+' elçi olarak eklendi; davet linki hazır.');ciz();
  });
  govde.append(f);
}
function ayarSekmesi(govde){
  var iAd=el('input',{type:'text',id:'ayarAd',maxlength:'80'}), iDonem=el('input',{type:'text',id:'ayarDonem',maxlength:'60'}), iOdul=el('textarea',{id:'ayarOdul',rows:'2',maxlength:'200'});
  iAd.value=V.okul.ad; iDonem.value=V.okul.donem; iOdul.value=V.okul.odul;
  var f=el('form',{class:'form',id:'ayarForm',novalidate:true},
    el('label',{class:'alan'},el('span',{text:'Okul adı'}),iAd),
    el('label',{class:'alan'},el('span',{text:'Dönem'}),iDonem),
    el('label',{class:'alan'},el('span',{text:'Elçi veliye verilecek ödül (veli ekranında aynen görünür)'}),iOdul),
    el('p',{class:'kunye',text:'Ödülü okul belirler. Ücret indirimi verilecekse ilan edilen indirim kurallarına uygun olmalıdır; yaz okulu, kulüp ya da kırtasiye gibi ödüller daha kolay yönetilir.'}),
    el('div',null,el('button',{type:'submit',class:'btn',text:'Kaydet'})));
  govde.append(f);
  f.addEventListener('submit',function(ev){
    ev.preventDefault();
    V.okul.ad=iAd.value.trim()||V.okul.ad;V.okul.donem=iDonem.value.trim();V.okul.odul=iOdul.value.trim();
    sakla();bildir('Program ayarı kaydedildi');ciz();
  });
}

/* ---------- elçi veli ekranı ---------- */
function cizElci(kok,kod){
  var e=elciBul(kod), wrap=el('div',{class:'wrap dar'});
  if(!e){wrap.append(el('div',{class:'kart'},el('h2',{text:'Bu davet sayfası bulunamadı'}),el('p',{class:'kunye',style:'margin-top:8px',text:'Link eksik ya da hatalı olabilir. Okuldan yeni linkinizi isteyin.'})));kok.append(wrap);return;}
  var s=elciSayilari(kod), link=davetLinki(kod);
  var mesaj='Merhaba, çocuğumuz '+V.okul.ad+' öğrencisi ve çok memnunuz. Okulu gezmek isterseniz buradan tur randevusu alabilirsiniz: '+link;
  wrap.append(el('div',{class:'selam'},el('div',{class:'ek',text:V.okul.ad}),el('h1',{text:'Merhaba '+e.ad.split(/\s+/)[0]}),
    el('p',{text:'Okulumuzu en iyi siz anlatırsınız. Tanıdığınız bir aileyi okul turuna davet edin.'})));
  if(V.okul.odul) wrap.append(el('div',{class:'odul'},el('div',{class:'yildiz','aria-hidden':'true',text:'★'}),
    el('div',null,el('b',{text:V.okul.odul}),el('span',{text:s.kayit>0?'Şimdiye kadar '+s.kayit+' aile sizin tavsiyenizle kayıt oldu.':'İlk tavsiyeniz kayda dönüştüğünde burada görünecek.'}))));

  var qrKutu=el('div',{class:'qr','aria-label':'Davet linkinin karekodu',role:'img'});
  try{var q=qrcode(0,'M');q.addData(link);q.make();qrKutu.innerHTML=q.createSvgTag({cellSize:4,margin:0,scalable:true});}catch(err){qrKutu.hidden=true;}
  wrap.append(el('section',{class:'kart'},
    el('h2',{style:'font-size:19px;margin-bottom:12px',text:'Size özel davet linkiniz'}),
    el('div',{class:'davet'},
      el('div',null,el('div',{class:'link',id:'davetLink',text:link}),
        el('div',{class:'dugmeler'},
          el('a',{class:'btn wa',id:'waBtn',href:'https://wa.me/?text='+encodeURIComponent(mesaj),target:'_blank',rel:'noopener',text:'WhatsApp’ta paylaş'}),
          el('button',{type:'button',class:'mini',id:'linkKopyala',text:'Linki kopyala',onclick:function(){kopyala(link,'Davet linki kopyalandı');}}),
          el('button',{type:'button',class:'mini',text:'Mesajı kopyala',onclick:function(){kopyala(mesaj,'Davet mesajı kopyalandı');}}))),
      qrKutu)));

  var benim=V.adaylar.filter(function(a){return a.elci===kod;}).sort(function(a,b){return a.tarih<b.tarih?1:-1;});
  var kart=el('section',{class:'kart'},el('h2',{style:'font-size:19px',text:'Davet ettiğiniz aileler'}));
  if(!benim.length) kart.append(el('p',{class:'bos',text:'Henüz davetinizle başvuran aile yok. Linkinizi paylaştığınızda başvurular burada görünür.'}));
  else{
    var ul=el('ul',{class:'liste'});
    benim.forEach(function(a){
      var sag=el('div',{class:'sag'},el('span',{class:'rozet '+a.asama,text:ASAMA_AD[a.asama]}));
      if(a.asama==='kayit') sag.append(el('span',{class:'rozet kazanc',text:a.odulVerildi?'Ödül verildi':'Ödül kazandınız'}));
      ul.append(el('li',null,el('div',{class:'kim'},el('strong',{text:kisaAd(a.ad)}),el('div',{class:'alt',text:tarihKisa(a.tarih)+' tarihinde başvurdu'})),sag));
    });
    kart.append(ul);
  }
  wrap.append(kart);
  wrap.append(el('p',{class:'kunye',text:'Davet ettiğiniz ailelerin yalnızca adı ve aşaması görünür; telefon ve diğer bilgileri okulda kalır.'}));
  kok.append(wrap);
}

/* ---------- davet edilen veli ---------- */
function cizDavet(kok,kod){
  var e=elciBul(kod), wrap=el('div',{class:'wrap dar'});
  if(U.gonderildi){
    wrap.append(el('div',{class:'kart tesekkur'},el('div',{class:'tik','aria-hidden':'true',text:'✓'}),
      el('h1',{style:'font-size:26px',text:'Başvurunuz alındı'}),
      el('p',{style:'max-width:36ch;color:var(--ink-2)',text:'Okulumuz sizi arayarak tur gününü ve saatini kesinleştirecek.'}),
      el('button',{type:'button',class:'mini',id:'paneldeGor',text:'Demo: okul panelinde nasıl göründüğüne bak',onclick:function(){U.gonderildi=false;U.sekme='adaylar';U.suz='yeni';git('okul');}})));
    kok.append(wrap);return;
  }
  wrap.append(el('div',{class:'selam'},el('div',{class:'ek',text:V.okul.ad}),
    el('h1',{text:e?kisaAd(e.ad)+' sizi okul turuna davet ediyor':'Okulumuzu yerinde görün'}),
    el('p',{text:'Yaklaşık 30 dakikalık bir tur. Karar vermeden önce okulu kendi gözünüzle görün.'})));
  wrap.append(el('ol',{class:'adimlar'},
    el('li',null,el('span',{text:'Sınıfları, oyun alanını ve yemekhaneyi gezersiniz.'})),
    el('li',null,el('span',{text:'Çocuğunuzun kademesindeki öğretmenle tanışırsınız.'})),
    el('li',null,el('span',{text:'Program, ücret ve servisle ilgili sorularınızı sorarsınız.'}))));

  var kSel=el('select',{id:'bKademe'}); KADEMELER.forEach(function(k){kSel.append(el('option',{value:k,text:k}));});
  var zSel=el('select',{id:'bZaman'}); ZAMANLAR.forEach(function(z){zSel.append(el('option',{value:z,text:z}));});
  var f=el('form',{class:'kart form',id:'basvuru',novalidate:true},
    el('h2',{style:'font-size:19px',text:'Tur randevusu isteyin'}),
    el('label',{class:'alan'},el('span',{text:'Adınız soyadınız'}),el('input',{type:'text',id:'bAd',autocomplete:'name',maxlength:'60'})),
    el('label',{class:'alan'},el('span',{text:'Telefonunuz'}),el('input',{type:'tel',id:'bTel',autocomplete:'tel',inputmode:'tel',maxlength:'20',placeholder:'05__ ___ __ __'})),
    el('div',{class:'ikili'},
      el('label',{class:'alan'},el('span',{text:'Çocuğunuzun kademesi'}),kSel),
      el('label',{class:'alan'},el('span',{text:'Size uygun zaman'}),zSel)),
    el('label',{class:'onay'},el('input',{type:'checkbox',id:'bOnay'}),
      el('span',{text:'Bilgilerimin yalnızca okul turu randevusu için benimle iletişime geçmek amacıyla işlenmesini kabul ediyorum. (Canlı sürümde okulun KVKK aydınlatma metni burada yer alır.)'})),
    el('p',{class:'hata',id:'bHata',role:'alert',hidden:true}),
    el('button',{type:'submit',class:'btn blok',text:'Randevu iste'}));
  f.addEventListener('submit',function(ev){
    ev.preventDefault();
    var ad=$('bAd').value.trim(), tel=$('bTel').value.trim(), h=$('bHata');
    var hata=!ad?'Adınızı yazın.':tel.replace(/\D/g,'').length<10?'Telefon numaranızı alan koduyla yazın.':!$('bOnay').checked?'Devam etmek için onay kutusunu işaretleyin.':'';
    h.textContent=hata;h.hidden=!hata;
    if(hata){(!ad?$('bAd'):tel.replace(/\D/g,'').length<10?$('bTel'):$('bOnay')).focus();return;}
    V.adaylar.push({id:'a'+Date.now(),ad:ad,tel:tel,kademe:$('bKademe').value,elci:e?e.kod:'',tarih:gunOnce(0),tercih:$('bZaman').value,asama:'yeni',odulVerildi:false});
    sakla();U.gonderildi=true;ciz();window.scrollTo(0,0);
  });
  wrap.append(f);
  kok.append(wrap);
}

/* ---------- ana çizim ---------- */
function ciz(){
  var r=rota(), kok=$('gorunum');
  ['rolOkul','rolElci','rolDavet'].forEach(function(id){var b=$(id);b.setAttribute('aria-pressed',b.dataset.rol===r.rol?'true':'false');});
  var sec=$('elciSec');$('elciSecKutu').hidden=r.rol==='okul';
  sec.textContent='';V.elciler.forEach(function(e){var o=el('option',{value:e.kod,text:e.ad});if(e.kod===r.kod)o.selected=true;sec.append(o);});
  $('sifirla').textContent=U.sifirOnay?'Emin misin? Tekrar bas':'Demoyu sıfırla';
  kok.textContent='';
  if(r.rol==='elci') cizElci(kok,r.kod); else if(r.rol==='davet') cizDavet(kok,r.kod); else cizOkul(kok);
  document.title=r.rol==='okul'?'Veli Elçi Programı':r.rol==='elci'?'Davet linkiniz':'Okul turu daveti';
}
['rolOkul','rolElci','rolDavet'].forEach(function(id){$(id).addEventListener('click',function(){
  U.gonderildi=false; var r=rota(); git(this.dataset.rol,r.kod||(V.elciler[0]&&V.elciler[0].kod));
});});
$('elciSec').addEventListener('change',function(){U.gonderildi=false;git(rota().rol,this.value);});
var sT=null;
$('sifirla').addEventListener('click',function(){
  if(!U.sifirOnay){U.sifirOnay=true;ciz();clearTimeout(sT);sT=setTimeout(function(){U.sifirOnay=false;ciz();},4000);return;}
  clearTimeout(sT);U.sifirOnay=false;V=ornek();sakla();U.sekme='adaylar';U.suz='hepsi';U.gonderildi=false;bildir('Demo ilk haline döndü');ciz();
});
window.addEventListener('hashchange',function(){ciz();window.scrollTo(0,0);});
ciz();
})();
</script>
